<script>
const RULES=["게임 시작하면 내가 보여준 사진 처럼 보이고 하단에 버튼으로 데스노트 펼치기를 누르면 공책 처럼 직선 형식으로 되어있고 거기에 이름을 적을수있음 그리고 상단 끝에 이 노트에 이름이 적힌 자는 죽는다.", "이름을 적은 인물의 얼굴을 알고 있지 않으면 효과가 없다. 따라서 같은 이름을 가진 사람을 한번에 없애는 효과는 없다.", "이름 다음에 인간계 단위로 40초 이내로 사인을 적으면 그대로 실현된다.", "사인을 적지 않으면 모두 심장마비로 죽는다.", "사인을 적으면 죽을 때의 자세한 상황을 기재할 6분 40초라는 시간이 주어진다.", "이 노트는 인간계에 떨어진 순간부터 인간계의 것이 된다.", "소유자는 노트의 원래 소유자인 사신의 모습이나 목소리를 인지할 수 있다.", "이 노트를 사용한 인간은 천국에도 지옥에도 갈 수 없다.", "사인을 심장마비라고 적은 뒤, 40초 이내에 사망시각을 적으면 심장마비라고 해도 죽는 시각을 조작할 수 있으며, 그 시각은 이름을 적은 후 40초 이내로도 가능하다.", "데스 노트를 만진 인간은 그 소유자가 아니어도 원래 소유자인 사신의 모습이나 목소리를 인지할 수 있다.", "데스 노트를 갖고 있는 한, 죽을 때까지 원래 소유자인 사신이 따라다닌다.", "사신은 통상적으로 인간이 노트를 사용한 39일 이내에 사용한 자 앞에 모습을 나타낸다.", "데스 노트의 원래 소유자인 사신은 그 노트를 사용해 인간을 죽이는 행위를 돕거나 방해하지 않는다.", "데스 노트 사용법이나 그걸 가진 인간에게 발생하는 현상을 사신이 모두 설명할 의무는 없다.", "사신은 데스 노트에 인간의 이름을 적어 자신의 수명을 늘릴 수 있지만, 인간은 수명을 늘릴 수 없다.", "데스 노트로 자신의 수명을 줄일 수 있다.", "데스 노트의 소유자가 된 인간은 남은 수명의 반과 바꿔서, 얼굴을 보면 인간의 이름과 수명을 알 수 있는 사신의 눈을 받을 수 있다.", "사신은 심장이 나이프에 찔려도 머리에 총을 맞아도 죽지 않는다. 하지만 일부 사신은 사신을 죽이는 방법을 알고 있다.", "노트에 적는 죽음의 상황은 그 인간이 물리적으로 실현 가능한 것, 그 인간이 해도 이상하지 않은 범위의 행동이 아니면 표현할 수 없다.", "죽음의 상황으로 가능한 일의 상세한 범위는 사신도 모르기 때문에, 자신이 직접 증명해보는 수밖에 없다.", "데스 노트에서 잘라낸 페이지나 그 일부 조각으로도 데스 노트의 모든 특성이 유효하다.", "노트에 적을 수만 있는 것이라면, 굳이 필기도구가 아니어도 상관없다. 화장품이나 피도 가능하다.", "원래 소유자인 사신도 데스 노트에 관해 모르는 것이 많다.", "사인이나 죽는 상황을 먼저 적고, 나중에 그 문장 앞에 이름을 적는 것도 유효하다. 그때의 유효 기간은 인간계 단위로 약 19일.", "데스 노트 소유자 이외의 제삼자가 얼굴과 이름을 인식하고 이름을 적으면, 소유자가 사용했을 때와 같은 효력이 있다.", "생후 780일이 지나지 않은 인간에겐 데스 노트의 효력이 생기지 않는다.", "동일인물의 얼굴을 떠올린 상태에서 그 인간의 이름을 네 번 틀리면, 데스 노트의 효력은 그 인간에게 적용되지 않게 된다.", "사인에 '자살'이라고 적는 것도 유효하며, 자살은 거의 모든 인간의 사인에 적용된다. 요컨대 '생각도 못 해본 일'의 범주엔 들어가지 않는다.", "자살이든 사고사든 이름이 적힌 인간 이외의 타인의 죽음을 직접적으로 유도하는 상황은 불가능하다. 타인의 죽음까지 유도하는 상황을 적은 경우엔, 데스 노트에 이름이 적힌 자가 제삼자의 죽음을 초래하지 않는 상황에서 심장마비로 죽게 된다.", "데스 노트에 이름, 죽는 시각, 죽음의 상황을 적은 다음에라도, 6분 40초 이내라면 죽는 시각, 죽는 상황은 몇 번이고 변경할 수 있다. 6분 40초 이내라고 해도 변경은 어디까지나 대상자가 죽기 전에만 가능하다.", "데스 노트에 적은 내용을 6분 40초 이내에 변경할 경우, 고치고 싶은 부분의 문자 위에 줄을 두줄 긋는다.", "시간이나 죽는 상황은 위에 적힌 대로 변경 가능하지만, 한번 이름이 적힌 인간의 죽음은 어떤 수단으로도 취소할 수 없다.", "데스 노트를 분실 또는 도둑맞은 경우, 490일 이내에 다시 되찾지 않으면 소유권을 잃게 된다.", "사신의 눈을 거래한 자는 소유권을 잃어버리면 노트의 기억과 함께 눈의 능력을 잃어버린다. 그 경우 반으로 줄어든 수명은 원래대로 돌아가지 않는다.", "소유권은 자신이 가지고 있는 채, 남에게 데스 노트를 빌려줄 수 있다. 또한 빌린 것을 또다시 남에게 빌려주는 것도 가능하다.", "사신은 데스 노트 소유권을 갖고 있는 자를 따라다니지, 데스 노트를 빌린 자를 따라다니니지 않는다. 또한 데스 노트를 빌린 자는 사신의 눈을 거래할 수 없다.", "데스 노트를 빌려준 상태에서 소유자가 죽은 경우, 소유권은 그때 데스 노트를 가지고 있는 자에게 넘어간다.", "데스 노트를 훔친자가 소유권을 가지고 있는 자를 죽인 경우, 소유권은 자동으로 그 사람에게 넘어간다.", "2권 이상의 데스 노트에 같은 사람의 이름이 적힌 경우, 기입한 사망 시간과 관계없이 먼저 적은 노트가 우선시된다.", "2권 이상의 데스 노트에 동일 인물의 이름이 적힌 경우, 기입된 시간차가 0.06초 이내의 경우엔 동일한 시간이라고 간주돼, 노트에 적힌 사항들이 무효가 되고 이름이 적힌 사람은 죽지 않게 된다.", "사신은 데스 노트를 반드시 한 권은 소유하고 있어야 한다. 그 한 권은 인간에게 양도할 수 없고, 인간에게 뭔가를 적도록 하는 것도 안 된다.[1]", "사신끼리 데스 노트를 교환하거나 다른 사신의 노트에 뭔가 적는 것은 아무런 문제도 없다.", "사신은 특정 인간에게 호의를 가지고 그 인간의 수명을 늘리기 위해 데스 노트를 사용해 인간을 죽이면 죽는다.", "죽은 사신은 사라지지만 데스 노트는 남는다. 그 노트의 소유권은 보통 그 다음에 제일 먼저 노트를 만진 사신에게 옮겨가지만, 사신대왕에게 반납하는 게 상식이다.", "인간계에서 데스 노트를 가진 인간끼리라도 상대방의 데스 노트를 만지지 않으면 상대에게 붙어 있는 사신의 모습과 목소리를 인지할 수 없다.", "사신의 눈을 가진 인간은 얼굴을 본 인간의 이름과 수명을 볼 수 있다. 그러나 데스 노트를 가짐으로써 목숨을 빼앗기는 쪽에서 빼앗는 쪽으로 바뀌기 때문에, 죽일 인간의 수명만 보이면 된다는 생각에 의거, 자신을 포함해 다른 데스 노트를 가진 인간의 수명을 볼 수 없다.", "사신은 인간계에서 사신의 눈으로 보이는 이름과 수명을 가르쳐줘선 안 된다. 이건 인간계의 혼란을 피하려는 배려이다.", "인간계에서 사용되는 데스 노트에는, 애당초 인간계에서 인간에게 사용하도록 하겠다는 살아 있는 사신의 의지가 있어야만 한다.", "인간에게 달라붙은 사신이 죽는 일은 생각하기 어려우나 죽었을 경우, 그 사신이 인간계에 가지고 온 데스 노트의 효력에 변화는 발생하지 않는다.", "사신의 눈으로 인간의 이름과 수명을 보려면 그 인간의 얼굴 좌우 절반 이상을 봐야만 하며, 상하의 경우엔 머리에서 코까지 볼 필요가 있다. 눈보다 아래는 봐도 이름과 수명이 보이지 않는다. 또한, 얼굴의 일부, 눈·코·입 등이 가려져 있어도 얼굴 전체가 보이면 이름과 수명을 볼 수 있다. 가려진 부분이 얼굴의 몇 %를 차지하면 이름과 수명이 보이지 않는가는 검증해 갈 수밖에 없다.", "상기 조건을 만족시키면, 아무리 과거의 물건이라도 사진이나 영상만으로도 이름과 수명을 볼 수 있다. 그러나 사진이나 영상의 경우엔 그 크기와 선명도에 따라서 보이지 않는 경우가 있다. 또한, 아무리 사실적이라도 초상화로는 이름과 수명을 볼 수 없다.", "사신의 눈을 가진 인간은 원래의 시력에 구애받지 않고 인간계에서 3.6에 해당하는 시력을 갖게 된다.", "데스 노트의 소유권을 잃은 인간은 자신이 데스 노트를 사용했던 일 등의 기억이 완전히 없어진다. 하지만, 노트를 가진 후 잃어버리기 전까지 모든 기억을 상실하는 것이 아니라, 자신이 해온 행동은 데스 노트의 소유자였다는 사실이 관계되지 않는 형태로 남는다.", "두 권 이상의 데스 노트의 소유권을 얻은 인간은, 한 권의 소유권을 잃으면 잃어버린 노트에 붙어 있던 사신의 모습과 목소리를 인지할 수 없게 되어 사신이 떨어진다. 그러나 한 권이라도 소유하고 있는 한 관련된 모든 데스노트에 대한 기억은 사라지지 않는다.", "사신은 아무 이유 없이 인간계에 머물러서는 안 된다. 인간계에 머물러도 좋은 조건은", "자신이 소유하고 있던 노트가 인간의 손에 들어갔을 때.", "노트를 건낼 인간을 물색하는 일은 본래 사신계에서 해야 하는 일이지만 82시간 이내라면 인간계에 머무르며 물색해도 상관없다.", "인간을 죽일 목적으로 보다 깊게 개인을 관찰하려는 경우에도, 그 인간에게 붙어 있는 게 82시간 이내라면 인간계에 머물라도 좋다.", "사신은 인간계에서 데스 노트를 직접 건낼 경우, 인간계 단위로 만 6세가 되지 않은 인간에게 노트를 건네서는 안 된다.", "만 6세 미만의 인간에게 건네서는 안 되지만, 인간계에 떨어뜨려 인간계의 것이 된 노트는 나이에 상관없이 누가 사용하든 그 효력은 같다.", "'사고사'라고만 적고 죽음의 상황을 적지 않은 경우엔 그로부터 6분 40초 후, 최단시간 내에 자연스러운 사고를 당해 사망한다.", "사고사 때의 죽음의 상황은, 비록 그때 사망하는 인간이 이름을 적힌 사람뿐이라도, 인간계의 환경에 지대한 영향을 끼친다. 그 일로 사망자가 발생할 듯한 상황은 '타인을 끌어들이는' 일이 되기 때문에 심장마비가 된다.", "데스 노트에 병사라고 적고 병명과 시간을 지정한 경우, 그 병의 진행에 필요한 만큼의 시간이 지정되어 있지 않아 무리가 발생하면 적고 나서 40초 후에 심장마비로 죽는다.", "병사라고 적었을 경우, 병명을 적지 않고 시간지정을 하면 그 시간에 맞춰 적당한 병으로 죽는다. 단, 데스 노트로 조종할 수 있는 시간은 인간계 단위로 23일 이내이다.", "병사인데 병명은 적고 죽는 시간은 지정하지 않은 경우, 그 병으로 사망하는데 24일 이상 걸릴 시엔 '죽는 시간을 조종할 수 있는 것은 23일간'이란 법칙이 적용되지 않고 그 병으로 사망하기에 적당한 때에 죽는다.", "상기의 경우라도 사인과 죽음의 상황 등을 고쳐쓸 수 잇는 것은 6분 40초 이내이며, 아무리 금방 일어날 죽음이라도 그 시간을 변경하는 것은 불가능하다.", "인간계 단위로 124세 이상인 인간을 데스 노트로 죽이는 것은 불가능하다.", "남은 수명이 인간계 단위로 12분 이하인 인간은 데스 노트로 죽일 수 없다.", "사신과 눈 거래를 했을 경우, 그 눈으로 보이는 인간의 수명은 인간계에 있는 데스 노트와는 관련이 없는, 인간계에서의 본래의 수명이다.", "또한, 사신의 눈으로 볼 수 있는 인간의 이름은 '그 인간을 죽이는데 필요한 이름'이며, 비록 호적 등에 이름이 없더라도 죽이는데 필요한 이름은 보인다.", "데스 노트는 아무리 이름을 적어도 페이지가 없어지지 않는다.", "두 권 이상의 노트를 소유한 경우, 동일한 인간의 얼굴을 떠올리고 적어 넣으면 한 권에 이름, 다른 한 권에 사인과 죽음의 상황을 적어도 그대로 실행된다. 따라서 한 권에 사인과 죽음의 상황을 적고, 나중에 다른 한 권에 이름을 적는 것도 유효하다.", "위와 같은 행동을 소유권이 다른 두 사람의 인간이 공동으로 행하는 일도 서로의 노트를 둘 다 만진 상태라면 가능하다.", "데스 노트의 소유권을 잃으면 그 데스 노트에 붙어 있던 사신의 모습과 목소리는 인지할 수 없게 되지만, 자기 소유가 아닌 노트와 접촉한 인간은 그 노트의 주인인 사신의 목소리를 계속 인지할 수 있다.", "따라서, 노트에 대한 소유권이 없는 인간이 노트와 접촉하여 인지하게 된 사신은 그 인간이 노트의 소유권을 얻고 나서 다시 잃지 않는 한 인지되게 된다.", "데스 노트를 가진 인간을 사신계에 있는 사신이 죽이는 일은 불가능하다.", "데스 노트를 가진 인간을 죽일 목적으로 사신이 인간게에 내려와 죽이는 것도 불가능하다.", "데스 노트를 가진 인간을 죽일 수 있는 것은 인간계에 데스 노트를 양도한 사신뿐이다.", "데스 노트에 이름이 적혀 죽는 일을 피하기 위해 고의로 4번 틀리게 적으면, 적어넣은 인간이 죽는다.", "고의로 4번 이름이 틀리게 적힌 인간은 4번 틀리게 적혔다고 해서 데스 노트에 이름을 적어도 죽지 않게 되지는 않는다.", "사신에는 수컷·암컷이 있으나 인간과의 생식행위는 허용되지 않고 불가능하며, 사신끼리도 교미하지 않는다.", "소유권을 상실했던 노트의 소유권을 다시 얻으면, 그 노트에 관한 기억이 돌아온다. 만일, 그밖에 도 관련했던 노트가 있으면 관련했던 모든 노트에 관한 기억이 돌아온다.", "또한 소유권을 얻지 못했더라도 노트를 만지고 있으면 만지고 있는 동안에 한해 기억이 돌아온다.", "데스 노트의 소유권을 상실하면서 그 노트에 관한 기억이 없어졌다가, 다시 소유권을 얻거나 노트를 만져 기억이 돌아오는 것은 노트 한 권당 6번까지.", "따라서 노트를 만지거나 소유권을 얻어 6번 기억을 되찾고 또 다시 같은 노트를 손에 넣었을 경우, 그것을 사용하면 기억이 돌아오지 않은 상태로 새롭게 사용하는 것이 된다.", "사신과 눈의 거래를 한 뒤 볼 수 있는 인간의 수명은 데스 노트에 좌우되지 않은, 그 인간의 인간계에서의 본래 수명이다. 데스 노트로 죽었을 경우, 남아 있던 수명이 사신에게 부여되는 것이다.", "사신의 눈을 거래한 인간은, 사진 등을 통해 이미 죽은 인간의 얼굴을 봐도 이름도 수명도 볼 수 없다.", "인간계에 있던 사신이 죽어 인간계에 남겨진 데스 노트는 인간이 주우면 그 인간의 것이 된다.", "하지만 이 경우, 그 사신의 모습과 목소리를 인지할 수 있었던 인간이 아니면 노트를 보는 것도 만지는 것도 불가능하다.", "가능성은 극히 낮으나, 사신이 주으면 그 사신의 것이 된다.", "데스 노트에 적인 이름이나 문자 등을 고무 지우개, 잉크 지우개, 수정액 등으로 지워도 아무런 의미가 없다.", "인간계에 데스 노트가 존재함으로 해서 한 사람의 인생이 바뀌거나, 데스 노트에 이름이 적히지 않더라도 본래 수명보다 앞서 죽어버리는 일이 있다. 어떻게 죽든지 간에, 그 경우 역시 사신의 눈에는 줄어든 수명이 아닌 본래의 수명이 보이게 된다.", "사신이 자신이 소유해야 할 데스 노트를 본의 아니게 인간계에 넘겼을 경우, 그 노트를 되돌려받을 목적으로 인간계에 있는 것은 허가된다.", "그때 인간계에 그밖에도 노트가 존재하고 있는 경우, 인간에게 그 노트가 있는 장소나 소유자를 알려줘선 안 된다.", "사신이 자신이 소유해야 할 데스 노트를 다른 사신에게 속아 빼앗기는 등 잃어버렸을 경우, 그 당시 그 노트에 붙어 있는 사신이 없는 상태에서 그 인간이 소유하고 있을 경우에는 일단 노트에 접촉해 그 인간에게 붙은 다음, 그 인간의 최후를 지켜본 뒤 다른 인간이 접촉하기 전에 줍든지, 혹은 그 인간에게 직접 돌려받아야만 한다.", "사신은, 한번이라도 얼궁를 봐서 이름과 수명을 알고 있는 인간이라면 사신계의 구멍을 통해 그 인간이 있는 장소를 알 수 있다.", "사신에게는 사신계에서 정해놓은 규칙이 있고, 그것을 깨게 되면 특급·1급에서 8급까지 아홉 단계의 죄가 있다. 3급 이상은 그 죄에 대한 벌을 받은 다음 죽는다.", "예를 들면, 사신이 데스 노트 이외의 수단으로 인간을 죽이는 일은 특급에 해당한다.", "데스 노트의 소유권을 다른 인간에게 넘기거나 폐기함으로써 그 노트에 관련된 기억 등이 없어지는 것은 실제로 노트에 이름을 적어 인간을 죽였을 경우이고, 소유만 했을 뿐 이름을 적지 않은 경우는 그 노트에 관한 기억은 사라지지 않는다. 그러나 노트를 소유함으로써 인지할 수 있었던 사신의 모습이나 목소리는 인지할 수 없게 되며, 거래를 한 사신의 눈도 잃게 된다.", "사신은 자지 않아도 죽지 않고, 본래 수면을 취할 필요는 없다. 사신의 수면은 인간의 수면과는 명백히 다르며, 단순한 게으름이다.", "특히 인간에게 노트를 양도하여 인간계에 있는 사신은 그 노트를 사용한 인간의 최후를 지켜봐야 하므로 게으름을 피워서는 안 되지만 정해진 규칙은 아니다.", "인간계에 동시에 존재해도 되는 데스 노트는 최대 6권. 물론 사신 자신의 소유인 노트는 그 수에 포함되지 않는다. 따라서, 인간에게 노트를 소유하게 함으로써 인간계에 있어도 되는 사신도 최대 6마리.", "사신 한 마리가 동시에 다른 인간에게 데스 노트를 건네도 되는 건 최대 3명.", "데스 노트를 건네는 인간이 3명 이내라면, 예를 들어 2권씩 3명에게 건네는 식으로 사신 한 마리가 최대 6권까지 노트를 인간에게 건네는 것이 가능하다.", "따라서, 한 사람의 인간이 6권의 노트를 사용하는 것도 가능하다.", "가령 인간계에 7권째 데스 노트가 존재하여 인간이 사용한다 해도, 그 노트는 아무런 효력도 지니지 않는다.", "7권 이상의 노트가 인간계에 있는 경우, 효력이 있는 것은 인간의 손에 건네진 순서가 빠른 6권이다.", "한권이 타거나 해서 노트의 효력을 잃거나 사신이 소유하여 사신계에 가지고 돌아가지 않는 한, 7권째에 효력은 생기지 않는다.", "데스 노트의 효력이 발생하려면 한 사람의 이름을 여러 페이지에 걸쳐 적어서는 안 된다.", "단, 그 페이지의 앞면과 뒷면은 1페이지로 간주되므로 예를 들어 앞면에 성, 뒷면에 이름을 적는 방식은 유효하다.", "데스 노트의 효력이 발생하려면 한 사람의 이름은 같은 페이지에 적어야 하지만, 그 이름에 관련된 사인이나 죽음의 상황은 적어넣는 그 이름에 대한 사인과 상황이라 생각하고 적으면 다른 페이지에 적더라도 유효하다.", "사인과 죽음의 상황을 먼저 적어두고 이름을 나중에 적는 경우 이름이 여러 개라도 40초 이내에 적기만 하면, 몇 명이든 상관없이 그 사인과 상황이 불가능하지 않은 이상 그대로 적용된다.", "사인은 가능하지만 상황은 불가능한 이름이 있을 경우엔 그 이름에 대해서는 사인만 적용되고, 양쪽 모두 불가능한 이름이 있으면 그 사람은 심장마비가 된다.", "이름을 여러 개 적을 때, 첫 이름을 적은 시간부터 인간계 단위로 40초 이내에 어떤 사인 하나만을 적어도 그것이 적힌 이름 전체에 적용된다.", "또한 사인을 적은 후 인간계 단위로 6분 40초 이내에 어떤 죽음의 상황 하나를 적었을 경우에도 가능한 사람은 상황이 그대로, 불가능한 사람은 사인만이 적용된다.", "데스 노트로 인간계의 본래 수명을 늘리는 직접적인 죽음 설정은 불가능하다. 인간계에서의 본래 수명 이후로 죽음의 시간을 설정해도 반드시 그 전에 죽는다.", "그 인간의 생사와 관련이 있는 다른 인간의 죽음을 조종함으로써 인간계에서의 본래 수명이 변해 늘어나는 일은 있다.", "사신이 결과적으로 수명이 늘어난 사람에게 호의를 가지고 위와 같은 일을 하면 사신은 죽지만, 인간의 경우엔 해도 죽지 않는다.", "특정 인간의 인간계에서의 본래 수명을 늘리기 위한 죽음이라고 의식하고 있지 않아도, 데스 노트에 의한 인간의 죽음을 통해 간접적으로 인간계의 본래 수명이 늘어나는 인간은 발생한다.", "사신이 인간계에 데스 노트를 가져와 인간에게 소유권을 넘겼더라도, 그 인간이 마음에 들지 않는 등의 이유로 그 인간을 자신의 노트로 죽이는 것은 전혀 상관없다.", "이름이나 죽음의 상황이 적혀 있는 위쪽에 겹쳐 이름 등을 적어도 위에 적힌 쪽은 무효가 되며, 이미 적혀 있던 쪽의 죽음·사인·죽음의 상황에는 어떤 영향도 미치지 않는다. 연필로 쓴 것을 지우거나 수정액 등으로 없앤 다음 그 위에 고쳐 적어도 마찬가지다.", "일단 이름·사인·죽음의 상황이 적히면, 만에 하나 설정된 죽음의 시간 전에 노트나 적어넣은 그 부분이 타거나 해도 적혔던 내용에 영향은 없다.", "이름을 쓰고 원인을 적는 도중에 타거나 했을 경우엔 이름을 쓰고 나서 40초 후에 심장마비로 죽는다.", "이름·사인을 적고, 죽음의 상황을 적는 도중에 타버리거나 했을 경우엔 6분 40초 이내에 가능한 사인이라면 사인은 유효, 불가능한 사인이라면 심장마비로 죽는다.", "사신의 눈을 가진 인간의 판별은 인간계의 어떤 의학이나 과학을 동원해도 불가능하며, 사신이라도 그 인간과 직접 눈의 거래를 한 사신 외엔 알 수 없다.", "인간계에 데스 노트를 가져온 사신이 사신계로 돌아가도 좋은 경우는", "인간계에 가져온 노트의 첫 소유자가 된 인간의 죽음을 지켜보고, 자신의 노트에 그 인간의 이름을 적었을 때.", "가져온 노트가 타거나 하여 인간이 사용할 수 없게 되었을 때.", "아무도 소유권을 가지지 않아 붙어 있을 필요가 없어졌을 때.", "어떤 이유로 가져온 노트에 붙은 사신이 바뀌었을 때.", "자신의 붙은 그 노트 자체가 잇는 장소나, 소유한 인간이 누구인지, 또 소유자의 소재지를 모르게 되어 사신계의 구멍을 통해 찾아야 할 때.", "2, 3, 4의 경우라도 자신의 최초로 양도했던 인간의 죽음은 사신계에서라도 확인하고 자신의 노트에 적어야 할 의무가 있다.", "인간계에서 말하는 데스 노트의 취급설명서 같은 것은 사신계에 몇 권 존재하지만 그것을 인간계에 건네는 것은 허락되지 않는다.", "그것을 자신이 읽고 인간에게 알려주는 것은 그 내용이 어떤 것이든 전혀 문제없다.", "데스 노트에는 흰색이나 빨간색 표지도 드물게 있으나, 사용법이나 효력은 검은색 노트와 전혀 차이가 없다.", "인간은 언젠가 반드시 죽는다", "죽은 후에 가는 곳은 무(無)이다.", "죽은 자는 살아돌아오지 않는다. 이 규칙들이 모여있는 규칙 버튼을 누를수있음."];
const $=id=>document.getElementById(id);
let activeAudio=null,audioCtx=null,realized=false;
let current=Number.parseInt(localStorage.getItem('deathNoteCurrentPageV3')||'0',10);
if(!Number.isFinite(current)||current<0)current=0;
let pages=JSON.parse(localStorage.getItem('deathNotePagesV3')||'null');
if(!Array.isArray(pages)||!pages.length){
  const oldPages=JSON.parse(localStorage.getItem('deathNotePagesV2')||'null');
  pages=Array.isArray(oldPages)&&oldPages.length?oldPages.map(p=>({text:[p?.name||'',p?.event||''].filter(Boolean).join('\n')})):[{text:''}];
}
if(current>=pages.length)current=pages.length-1;
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1900)}
function persist(){localStorage.setItem('deathNotePagesV3',JSON.stringify(pages));localStorage.setItem('deathNoteCurrentPageV3',String(current));updateCoverHint()}
function syncCurrent(){pages[current]={text:$('noteText').value};persist();updateNav()}
function updateNav(){$('pageNo').textContent='PAGE '+(current+1);$('pageCount').textContent=(current+1)+' / '+pages.length;$('prev').disabled=current===0}
function loadPage(i){if(i<0)i=0;if(i>=pages.length)i=pages.length-1;current=i;const q=pages[current]||{text:''};$('noteText').value=q.text??[q.name||'',q.event||''].filter(Boolean).join('\n');localStorage.setItem('deathNoteCurrentPageV3',String(current));autoGrowNote();updateNav();updateCoverHint()}
function autoGrowNote(){const e=$('noteText');if(!e)return;e.style.height='auto';e.style.height=e.scrollHeight+'px'}
function safePlay(el){try{const p=el.play();if(p&&p.catch)p.catch(()=>{});return p}catch(e){return null}}
function stopAll(){ $('low').pause(); $('light').pause(); }
function playLightFromStart(){
  if(realized)return;
  const a=$('light');
  $('low').pause();
  a.loop=true;
  a.muted=false;
  a.volume=1;
  try{a.currentTime=0}catch(e){}
  activeAudio=a;
  safePlay(a);
}
function playLight(){
  const a=$('light');
  a.loop=true;
  a.muted=false;
  a.volume=1;
  activeAudio=a;
  safePlay(a);
}
function realize(){
  const a=$('low');
  const b=$('light');
  stopAll();
  realized=true;
  a.loop=false;
  b.loop=true;
  b.muted=true;
  b.volume=1;
  a.volume=1;
  try{a.currentTime=0;b.currentTime=0}catch(e){}
  safePlay(b);
  activeAudio=a;
  safePlay(a);
}
$('low').addEventListener('ended',()=>{
  const a=$('light');
  if(!realized)return;
  a.loop=true;
  a.muted=false;
  a.volume=1;
  try{a.currentTime=0}catch(e){}
  activeAudio=a;
  safePlay(a);
});
function updateCoverHint(){const last=Number.parseInt(localStorage.getItem('deathNoteCurrentPageV3')||'0',10);$('coverHint').textContent='THE HUMAN WHOSE NAME IS WRITTEN IN THIS NOTE SHALL DIE. · 최근 PAGE '+(Number.isFinite(last)?last+1:1)}
function pageSound(){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;audioCtx=audioCtx||new AC();if(audioCtx.state==='suspended')audioCtx.resume();const d=.62,n=Math.floor(audioCtx.sampleRate*d),buf=audioCtx.createBuffer(1,n,audioCtx.sampleRate),a=buf.getChannelData(0);for(let i=0;i<n;i++){let t=i/n;a[i]=(Math.random()*2-1)*Math.pow(Math.sin(Math.PI*t),1.7)}const src=audioCtx.createBufferSource(),f=audioCtx.createBiquadFilter(),g=audioCtx.createGain();src.buffer=buf;f.type='bandpass';f.frequency.value=1050;f.Q.value=.65;g.gain.setValueAtTime(.0001,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.16,audioCtx.currentTime+.06);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+d);src.connect(f);f.connect(g);g.connect(audioCtx.destination);src.start();src.stop(audioCtx.currentTime+d)}catch(e){}}
function turn(){const b=$('book');if(!b)return;b.classList.remove('turn');void b.offsetWidth;b.classList.add('turn');pageSound();setTimeout(()=>b.classList.remove('turn'),800)}
$('openBook').onclick=()=>{if(!realized)playLightFromStart();$('home').classList.add('hidden');$('rulesPage').classList.add('hidden');$('work').classList.remove('hidden');loadPage(current);turn()};
document.addEventListener('pointerdown',()=>{if(!realized){const a=$('light');if(a.paused)playLightFromStart()}},{passive:true});
$('realize').addEventListener('click',realize);
$('back').onclick=()=>{syncCurrent();$('work').classList.add('hidden');$('rulesPage').classList.add('hidden');$('home').classList.remove('hidden');updateCoverHint()};
$('noteText').addEventListener('input',()=>{autoGrowNote();syncCurrent()});
window.addEventListener('pagehide',()=>{try{syncCurrent()}catch(e){localStorage.setItem('deathNoteCurrentPageV3',String(current))}});
window.addEventListener('beforeunload',()=>{try{syncCurrent()}catch(e){}});
$('save').onclick=()=>{syncCurrent();turn();toast('PAGE '+(current+1)+' 저장 완료')};
$('clear').onclick=()=>{if(!confirm('현재 페이지의 내용을 지울까요?'))return;$('noteText').value='';autoGrowNote();syncCurrent();toast('현재 페이지를 비웠습니다')};
$('prev').onclick=()=>{if(current===0)return;syncCurrent();loadPage(current-1);turn()};
$('next').onclick=()=>{syncCurrent();if(current===pages.length-1)pages.push({text:''});loadPage(current+1);persist();turn()};
$('rulesBtn').onclick=()=>{$('work').classList.add('hidden');$('rulesPage').classList.remove('hidden');pageSound()};
$('closeRules').onclick=()=>{$('rulesPage').classList.add('hidden');$('work').classList.remove('hidden');loadPage(current);turn()};
$('ruleList').innerHTML=RULES.map((r,i)=>`<div class="rule"><b>${i+1}.</b>${r.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')}</div>`).join('');
updateCoverHint();loadPage(current);autoGrowNote();
</script></body></html>
